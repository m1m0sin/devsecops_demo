name: CD - Java 21 Demo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (semver, ej: 1.0.0)"
        required: true
        type: string

jobs:

  build:
    name: Build del proyecto
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ steps.build.outputs.artifact-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR
        id: build
        run: |
          mvn -B clean package
          echo "artifact-path=target/*.jar" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  deploy-dev:
    name: Deploy Simulado en Dev
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: dev

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy en Dev
        run: |
          echo "Desplegando versión ${{ github.event.inputs.version }} en DEV..."
          echo "Archivo desplegado:"
          ls -l
          echo "Deploy exitoso en DEV"


  deploy-qa:
    name: Deploy en QA
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: qa   # Aquí se activa la aprobación manual si se configuró

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy en QA
        run: |
          echo "Desplegando en QA..."
          echo "Versión: ${{ github.event.inputs.version }}"
          ls -l
          echo "Deploy exitoso en QA"


  deploy-prod:
    name: Deploy en Prod
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment:
      name: prod  # También puede pedir aprobación

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy en PRODUCCIÓN
        run: |
          echo "PUBLICANDO versión ${{ github.event.inputs.version }} en PRODUCCIÓN"
          ls -l
          echo "PRODUCCIÓN ACTUALIZADA"
