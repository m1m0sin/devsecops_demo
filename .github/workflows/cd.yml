name: CD - Java 21 Demo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (semver, ej: 1.0.0)"
        required: true
        type: string

jobs:

  build:
    name: Build del proyecto
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ steps.build.outputs.artifact-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR
        id: build
        working-directory: demo
        run: |
          mvn -B clean package
          echo "artifact-path=demo/target/*.jar" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: demo/target/*.jar


  deploy-dev:
    name: Deploy Simulado en Dev
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: dev

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy en Dev
        run: |
          echo "======================================="
          echo "   Desplegando versión ${{ github.event.inputs.version }} en DEV"
          echo "======================================="
          ls -l
          echo "Deploy exitoso en DEV"


  deploy-qa:
    name: Deploy en QA
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: qa

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy en QA
        run: |
          echo "======================================="
          echo "        Desplegando en QA"
          echo " Versión: ${{ github.event.inputs.version }}"
          echo "======================================="
          ls -l
          echo "Deploy exitoso en QA"


  deploy-prod:
    name: Deploy en Prod
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment:
      name: prod

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy en PRODUCCIÓN
        run: |
          echo "======================================="
          echo " PUBLICANDO versión ${{ github.event.inputs.version }} en PRODUCCIÓN"
          echo "======================================="
          ls -l
          echo "PRODUCCIÓN ACTUALIZADA"
