name: Commit Convention Validation

on:
  pull_request:

jobs:
  lint-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/config-conventional @commitlint/cli

      - name: Validate commit messages
        run: |
          npx commitlint --from=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD) --to=HEAD
